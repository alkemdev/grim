[workspace]
resolver = "3"
members = ["crates/grim", "crates/grim-apply", "crates/grim-core"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
authors = ["Cade Brown <brown.cade@gmail.com>"]
repository = "https://github.com/alkemdev/grim"
description = "A grimoire for your machines: declarative, cross-platform environment management."

# Shared dependency versions are declared here as the engine grows, then opted into
# per-crate with `dep = { workspace = true }`. Kept empty until a crate actually needs one,
# so the workspace always compiles clean.
[workspace.dependencies]

[profile.release]
strip = true
lto = "thin"
