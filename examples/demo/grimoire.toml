# An example grimoire. A grimoire is a directory containing this `grimoire.toml` and a `files/` tree.
#
#     grim stack --grimoire examples/demo     # resolve the platform stack for this machine
#     grim diff  --grimoire examples/demo --target /tmp/grim-demo   # preview the file apply
#     grim apply --grimoire examples/demo --target /tmp/grim-demo   # place the files
#
# Precedence is inferred from which facts each platform constrains — no numbers to manage in the
# common case. The bands, lowest to highest: os < arch < distro < hardware < host < container.

[grimoire]
name = "demo"
# extends = ["vendor/dotfiles"]   # grimoire composition (home <- work) lands in a later phase

[platform.macos]
match = { os = "macos" }

[platform.linux]
match = { os = "linux" }

# Hardware band: outranks the OS layers.
[platform.cuda]
match = { gpu = { vendor = "nvidia" } }

[platform.avx512]
match = { cpu_features = { all = ["avx512f"] } }

# Host band: a specific machine outranks hardware/OS layers.
[platform.workstation]
match = { hostname = "x1" }

# Container band: a dev container tops the stack.
[platform.devcontainer]
match = { container = {} }

# Packages — one canonical id, ordered providers. The first provider whose platform gate is
# satisfied is preferred (whether the manager is installed is checked later, at `grim sync`).
[package.ripgrep]
providers = [{ brew = "ripgrep" }, { cargo = "ripgrep" }]

[package.docker]
providers = [
    { brew = "docker", platform = "macos" },
    { apt = "docker.io", platform = "linux" },
]
